services:
  - type: web
    name: satquery-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: satquery-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_MODE
        value: local
      - key: STORAGE_PATH
        value: /opt/render/project/src/storage

databases:
  - name: satquery-db
    databaseName: satquery
    user: satquery
